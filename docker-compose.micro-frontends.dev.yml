# runs the 3 apps together in development mode with live reload (the 3 repos must be cloned next to each other)
# docker compose -f docker-compose.micro-frontends.dev.yml up --build
# then open http://localhost:3000 (the remote apps urls are the devUrl values of buildTools/constants.js)
services:
  container-app:
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/app
      - /usr/app/node_modules/
  inner-app:
    build:
      context: ../micro-frontend-inner-app
      target: development
    ports:
      - '3001:3001'
    volumes:
      - ../micro-frontend-inner-app:/usr/app
      - /usr/app/node_modules/
  second-inner-app:
    build:
      context: ../micro-frontend-second-inner-app
      target: development
    ports:
      - '3002:3002'
    volumes:
      - ../micro-frontend-second-inner-app:/usr/app
      - /usr/app/node_modules/
