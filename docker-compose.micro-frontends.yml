# runs the production images of the 3 apps together (the 3 repos must be cloned next to each other)
# docker compose -f docker-compose.micro-frontends.yml up --build
# then open http://localhost:8080
# the REMOTE_<APP_NAME> environment variables set the urls of the remote apps without rebuilding the images
services:
  container-app:
    build:
      context: .
      target: production
    ports:
      - '8080:80'
    environment:
      REMOTE_INNER_APP: http://localhost:8081
    depends_on:
      - inner-app
  inner-app:
    build:
      context: ../micro-frontend-inner-app
      target: production
    ports:
      - '8081:80'
    environment:
      REMOTE_SECOND_INNER_APP: http://localhost:8082
    depends_on:
      - second-inner-app
  second-inner-app:
    build:
      context: ../micro-frontend-second-inner-app
      target: production
    ports:
      - '8082:80'
